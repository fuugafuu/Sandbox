<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#080d12" />
  <title>Sandbox — Mark 50 Physics Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Physics sandbox"></canvas>

    <section id="hud" class="glass">
      <div class="brand"><span class="arc-dot"></span><strong>SANDBOX</strong><small>MARK 50 LAB</small></div>
      <div class="meter-group">
        <label>BODY <span id="healthText">100</span>%</label>
        <div class="meter"><i id="healthBar"></i></div>
      </div>
      <div class="meter-group">
        <label>NANO <span id="nanoText">100</span>%</label>
        <div class="meter nano"><i id="nanoBar"></i></div>
      </div>
      <div class="meter-group">
        <label>POWER <span id="energyText">100</span>%</label>
        <div class="meter power"><i id="energyBar"></i></div>
      </div>
      <div class="status-pill" id="suitState">TONY / CIVILIAN</div>
      <div class="status-pill weapon" id="weaponState">REPULSOR</div>
    </section>

    <aside id="inventory" class="glass">
      <div class="panel-title">SPAWN</div>
      <button data-spawn="dummy"><b>◉</b><span>Test Dummy</span></button>
      <button data-spawn="crate"><b>□</b><span>Crate</span></button>
      <button data-spawn="concrete"><b>▣</b><span>Concrete</span></button>
      <button data-spawn="barrel"><b>◎</b><span>Explosive</span></button>
      <button data-spawn="steel"><b>◆</b><span>Steel Block</span></button>
      <hr />
      <button id="resetBtn"><b>↻</b><span>Reset</span></button>
      <button id="pauseBtn"><b>Ⅱ</b><span>Pause</span></button>
      <button id="slowBtn"><b>½</b><span>Slow-mo</span></button>
    </aside>

    <section id="weaponDock" class="glass">
      <button data-weapon="0" class="active"><span>1</span>Repulsor</button>
      <button data-weapon="1"><span>2</span>Unibeam</button>
      <button data-weapon="2"><span>3</span>Nano Blade</button>
      <button data-weapon="3"><span>4</span>Shield</button>
      <button data-weapon="4"><span>5</span>Ram</button>
      <button data-weapon="5"><span>6</span>Cluster</button>
      <button data-weapon="6"><span>7</span>Missiles</button>
    </section>

    <div id="hint" class="glass">Drag objects · E suit · Q weapon · F flight · Mouse/Space fire · Wheel zoom</div>

    <section id="mobileControls">
      <div class="mobile-left">
        <button data-hold="left">◀</button>
        <button data-hold="up">▲</button>
        <button data-hold="right">▶</button>
      </div>
      <div class="mobile-mid">
        <button id="mobileSuit">SUIT</button>
        <button id="mobileFlight">FLIGHT</button>
      </div>
      <div class="mobile-right">
        <button id="mobileWeapon">MODE</button>
        <button id="mobileFire" class="fire">FIRE</button>
      </div>
    </section>

    <div id="toast"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
