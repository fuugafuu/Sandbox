<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Sandbox</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Physics sandbox"></canvas>

    <header id="topbar" class="panel">
      <div class="brand">
        <strong>SANDBOX</strong>
        <small>PHYSICS PLAYGROUND</small>
      </div>
      <div class="scene-chip"><span class="dot"></span>SCENE 01</div>
      <div class="top-spacer"></div>
      <button id="pauseBtn" title="Pause (P)">Ⅱ</button>
      <button id="slowBtn" title="Slow motion (T)">½</button>
      <button id="resetBtn" title="Reset scene (R)">↻</button>
    </header>

    <aside id="inventory" class="panel" aria-label="spawn objects">
      <div class="palette-title">SPAWN</div>
      <button data-spawn="dummy" data-label="Dummy"><b>人</b><span>Living</span></button>
      <button data-spawn="thanos" data-label="Thanos"><b>Θ</b><span>Thanos</span></button>
      <button data-spawn="crate" data-label="Crate"><b>□</b><span>Crate</span></button>
      <button data-spawn="concrete" data-label="Concrete"><b>▣</b><span>Concrete</span></button>
      <button data-spawn="barrel" data-label="Explosive"><b>!</b><span>Explosive</span></button>
      <button data-spawn="steel" data-label="Steel"><b>◆</b><span>Steel</span></button>
    </aside>

    <aside id="selectionPanel" class="panel">
      <div class="selection-head">
        <div>
          <small>SELECTED</small>
          <strong id="selectedName">TONY STARK</strong>
        </div>
        <span id="suitState">CIVILIAN</span>
      </div>
      <div class="stat hp"><span id="healthLabel">HEALTH</span><div class="track"><i id="healthBar"></i></div><b id="healthText">100</b></div>
      <div class="stat nano"><span id="nanoLabel">NANO RESERVE</span><div class="track"><i id="nanoBar"></i></div><b id="nanoText">100</b></div>
      <div class="stat power"><span id="energyLabel">POWER</span><div class="track"><i id="energyBar"></i></div><b id="energyText">100</b></div>
    </aside>

    <section id="weaponPanel" class="panel">
      <div class="weapon-caption">
        <small>TONY ABILITY</small>
        <strong id="weaponState">REPULSOR</strong>
      </div>
      <div id="weaponDock">
        <button data-weapon="0" class="active" title="Repulsor"><span>1</span><b>REP</b></button>
        <button data-weapon="1" title="Unibeam"><span>2</span><b>UNI</b></button>
        <button data-weapon="2" title="Nano Blade"><span>3</span><b>BLD</b></button>
        <button data-weapon="3" title="Nano Shield"><span>4</span><b>SHD</b></button>
        <button data-weapon="4" title="Battering Ram"><span>5</span><b>RAM</b></button>
        <button data-weapon="5" title="Cluster Cannon"><span>6</span><b>CLS</b></button>
        <button data-weapon="6" title="Micro Missiles"><span>7</span><b>MSL</b></button>
      </div>
    </section>

    <div id="desktopHelp">empty drag = camera · object drag = grab · A/D = Tony move · W = jump · E = suit · F = flight · SPACE = use</div>

    <section id="mobileControls">
      <div class="move-pad">
        <button data-hold="left">◀</button>
        <button data-hold="up">▲</button>
        <button data-hold="right">▶</button>
      </div>
      <div class="mobile-actions">
        <button id="mobileSuit">SUIT</button>
        <button id="mobileFlight">FLY</button>
        <button id="mobileWeapon">MODE</button>
        <button id="mobileFire" class="fire">USE</button>
      </div>
    </section>

    <div id="toast"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="./game.js?v=4"></script>
</body>
</html>
