<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <title>Sandbox — Mark 50</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Physics sandbox"></canvas>

    <section id="statusHud" aria-label="character status">
      <div class="identity">
        <span class="reactor"></span>
        <div><strong>MARK 50</strong><small id="suitState">TONY / CIVILIAN</small></div>
      </div>
      <div class="stat hp"><span>HP</span><div class="track"><i id="healthBar"></i></div><b id="healthText">100</b></div>
      <div class="stat nano"><span>NANO</span><div class="track"><i id="nanoBar"></i></div><b id="nanoText">100</b></div>
      <div class="stat power"><span>ARC</span><div class="track"><i id="energyBar"></i></div><b id="energyText">100</b></div>
    </section>

    <section id="utilityDock" class="dock" aria-label="simulation controls">
      <button id="pauseBtn" title="Pause (P)">Ⅱ</button>
      <button id="slowBtn" title="Slow motion (T)">½</button>
      <button id="resetBtn" title="Reset (R)">↻</button>
    </section>

    <aside id="inventory" class="dock" aria-label="spawn objects">
      <button data-spawn="dummy" data-label="Dummy"><b>人</b></button>
      <button data-spawn="crate" data-label="Crate"><b>□</b></button>
      <button data-spawn="concrete" data-label="Concrete"><b>▣</b></button>
      <button data-spawn="barrel" data-label="Explosive"><b>!</b></button>
      <button data-spawn="steel" data-label="Steel"><b>◆</b></button>
    </aside>

    <section id="weaponPanel">
      <div class="weapon-label"><small>WEAPON</small><strong id="weaponState">REPULSOR</strong></div>
      <div id="weaponDock" class="dock">
        <button data-weapon="0" class="active" title="Repulsor"><span>1</span><b>REP</b></button>
        <button data-weapon="1" title="Unibeam"><span>2</span><b>UNI</b></button>
        <button data-weapon="2" title="Nano Blade"><span>3</span><b>BLD</b></button>
        <button data-weapon="3" title="Nano Shield"><span>4</span><b>SHD</b></button>
        <button data-weapon="4" title="Battering Ram"><span>5</span><b>RAM</b></button>
        <button data-weapon="5" title="Cluster Cannon"><span>6</span><b>CLS</b></button>
        <button data-weapon="6" title="Micro Missiles"><span>7</span><b>MSL</b></button>
      </div>
    </section>

    <div id="desktopHelp">A D move · W jump · E suit · F flight · Q weapon · drag objects · SPACE fire</div>

    <section id="mobileControls">
      <div class="move-pad">
        <button data-hold="left">◀</button>
        <button data-hold="up">▲</button>
        <button data-hold="right">▶</button>
      </div>
      <div class="mobile-actions">
        <button id="mobileSuit">SUIT</button>
        <button id="mobileFlight">FLY</button>
        <button id="mobileWeapon">MODE</button>
        <button id="mobileFire" class="fire">FIRE</button>
      </div>
    </section>

    <div id="toast"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
